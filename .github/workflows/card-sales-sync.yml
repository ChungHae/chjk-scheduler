name: 카드매출 동기화 (머니온/SemPlus → Firebase)

on:
  schedule:
    # 평일(월~금)만, 한국시간 오전 8시(UTC 전날 23시)에 실행.
    # 주말에는 애초에 실행되지 않도록 요일 필드를 1-5(월~금)로 제한.
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}   # 수동 실행(첫 검증 등)을 위한 트리거

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        working-directory: automation
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 2026-11-03: 한쪽 사이트가 바뀌어 실패하면 job 이 거기서 멈춰 다른 쪽까지
      # 같이 멈췄다(11-02·11-03 머니온 실패 → 화성 SemPlus 는 0초, 실행조차 안 됨).
      # 그래서 두 수집을 서로 끊어 두고, 끝에서 한 번에 성공/실패를 판정한다.
      - name: 머니온(서울) 매출 동기화
        id: moneyon
        continue-on-error: true
        working-directory: automation
        env:
          MONEYON_ID: ${{ secrets.MONEYON_ID }}
          MONEYON_PW: ${{ secrets.MONEYON_PW }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scrape_moneyon.py

      - name: SemPlus(화성) 매출 동기화
        id: semplus
        continue-on-error: true
        if: always()
        working-directory: automation
        env:
          SEMPLUS_ID: ${{ secrets.SEMPLUS_ID }}
          SEMPLUS_PW: ${{ secrets.SEMPLUS_PW }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scrape_semplus.py

      # 로그인/화면 조작이 실패하면 그 시점의 화면을 스크린샷으로 남기는데
      # (scrape_semplus.py / scrape_moneyon.py 참고), 이 스텝이 그걸 실행 결과의
      # "Artifacts" 로 내려받을 수 있게 올려 준다 — 텍스트 오류만으로 원인을
      # 못 좁힐 때 이 이미지를 보면 된다.
      - name: 실패 화면 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-sales-debug
          path: |
            automation/semplus_login_debug.png
            automation/moneyon_login_debug.png
          if-no-files-found: ignore

      # 한쪽만 실패해도 실행은 '실패' 로 남겨 알아차릴 수 있게 하되,
      # 어느 쪽이 실패했는지 메시지로 분명히 남긴다.
      - name: 수집 결과 판정
        if: always()
        run: |
          M="${{ steps.moneyon.outcome }}"
          S="${{ steps.semplus.outcome }}"
          echo "머니온(서울): $M / SemPlus(화성): $S"
          FAIL=0
          if [ "$M" != "success" ]; then echo "::error title=머니온(서울) 수집 실패::머니온 단계가 $M 로 끝났습니다. 위 '머니온(서울) 매출 동기화' 로그와 Artifacts 의 moneyon_login_debug.png 를 확인하세요."; FAIL=1; fi
          if [ "$S" != "success" ]; then echo "::error title=SemPlus(화성) 수집 실패::SemPlus 단계가 $S 로 끝났습니다. 위 'SemPlus(화성) 매출 동기화' 로그와 Artifacts 의 semplus_login_debug.png 를 확인하세요."; FAIL=1; fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "두 곳 모두 수집 성공"
