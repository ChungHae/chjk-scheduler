name: 로그인 비밀번호 재동기화 (Firebase Auth ↔ 계정DB, 수동 실행 전용)

# "성명 또는 비밀번호가 올바르지 않습니다" 오류가 일부 PC(로그인 세션이 캐시되어 있지
# 않은 곳)에서만 발생하는 문제 대응용. 관리자 화면("계정 관리")에서 직원 비밀번호를
# 재설정해도 Firebase Auth 서버 쪽 실제 로그인 비밀번호는 갱신되지 않는 기존 버그로
# 인해, 두 곳의 비밀번호 정보가 어긋난 계정이 있을 수 있다.
#
# 이 워크플로우는 모든 계정의 Firebase Auth 비밀번호를 현재 계정DB(pwHash)에 맞춰
# 강제 재동기화한다 - 실제 평문 비밀번호를 몰라도 되고(저장된 해시값만 사용), 이미
# 일치하는 계정은 같은 값으로 다시 쓰는 것뿐이라 여러 번 실행해도 안전(멱등)하다.
on:
  workflow_dispatch:

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        working-directory: automation
        run: pip install -r requirements.txt

      - name: 비밀번호 재동기화 실행
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python resync_auth_passwords.py
